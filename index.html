<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06251a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Азкары — утро и вечер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Фоновые светящиеся частицы -->
<div class="bg-orbs" aria-hidden="true">
  <span></span><span></span><span></span>
  <span></span><span></span><span></span>
</div>

<!-- Шапка -->
<header class="slide-down">
  <div class="crescent">☪</div>
  <h1 class="greeting">Азкары</h1>
  <p class="subtitle">Поминание Аллаха утром и вечером</p>

  <div class="progress-wrap">
    <div class="progress-info">
      <span>Прогресс</span>
      <span id="progressText">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
</header>

<!-- Табы -->
<nav class="tabs">
  <button class="tab active" data-mode="morning">
    <span>☀</span> Утренние
  </button>
  <button class="tab" data-mode="evening">
    <span>☾</span> Вечерние
  </button>
</nav>

<!-- Контент -->
<main>
  <section class="content active" id="content-morning"></section>
  <section class="content" id="content-evening"></section>
</main>

<footer>
  <p id="footerDate"></p>
  <p>Прогресс сохраняется автоматически</p>
</footer>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
